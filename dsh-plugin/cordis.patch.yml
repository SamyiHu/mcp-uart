# UART 串口工具：MCP 服务器 + 串口面板，一个 bundle 同时管两端
#
# 1) MCP 行：把串口工具（serial_open / serial_read / dut_* / …）注入给 Agent。
#    命令指向本仓库的 Node MCP 服务器；Rust 版 uartd 就绪后改 command 即可。
# 2) 面板行：侧边栏「串口」+ 串口控制台 + 悬浮球 + 底部状态条。
#
# 两条同进同出：只装面板不会让 Agent 拿不到工具，反之亦然。
- insert:
    - id: mcp-uart
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: uart
        transport: stdio
        command: node
        args:
          - 'E:\Desktop_Projects\小程序\MCP_Uart\dist\index.js'
        cwd: 'E:\Desktop_Projects\小程序\MCP_Uart'
        env:
          # Keep the in-process Hub on its default port so the panel finds it.
          UART_HUB: '1'
        failOnStartupError: true
- insert:
    - id: local-uart
      name: '@local/dsh-uart'
