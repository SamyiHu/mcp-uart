# UART 串口：DSH 专用工具 + 面板（不含 MCP 行）
#
# 本 bundle 不再挂 MCP client 行。DSH 里的串口能力由两部分组成：
#   1) index.js 启动本地 Hub（dist/hub.js 子进程），并注册 3 个分组工具
#      uart_serial / uart_dut / uart_view（设置页可开关）
#   2) client.js 渲染侧边栏面板 / 悬浮球 / 底栏状态条
#
# 外部（非 DSH）用户仍用 `node dist/index.js` 作为标准 MCP 服务器，28 个工具全量；
# 那是独立进程，与本 bundle 无关。
- insert:
    - id: local-uart
      name: '@local/dsh-uart'
      config:
        # Agent 工具默认开；设置页的开关会持久化到 ~/.mcp-uart/agent.json
        agentTool: true
