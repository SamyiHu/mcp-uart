# 串口工具：三个分组工具，与「串口面板」bundle 配套使用
#
# 单独成包是为了在插件页有自己的名称和说明（DSH 的行标题来自包元信息，
# 同一包的子路径行只能显示 package/subpath）。
#
# 依赖面板 bundle 启动的 Hub（地址写在 ~/.mcp-uart/hub.json）。与 MCP 行互斥：
# 注册表里出现 mcp__uart__* 时本行自动让位，MCP 行移除后再自动接管。
- insert:
    - id: local-uart-tools
      name: '@local/dsh-uart-tools'
      config:
        enabled: true
