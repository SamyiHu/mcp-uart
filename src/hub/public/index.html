<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>UART Hub</title>
<style>
  :root {
    --bg:#0f1419; --panel:#1a2332; --panel2:#141c28; --ink:#e7ecf3; --muted:#8b9bb4;
    --line:#2a3548; --tx:#3d9cf0; --rx:#3ecf8e; --err:#f07178; --accent:#7aa2f7;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body {
    font:13px/1.45 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); overflow:hidden;
    display:grid; grid-template-columns:300px 1fr; grid-template-rows:48px 1fr;
  }
  header {
    grid-column:1 / -1; display:flex; align-items:center; gap:12px;
    padding:0 16px; border-bottom:1px solid var(--line); background:var(--panel2);
  }
  header h1 { margin:0; font-size:14px; font-weight:600; letter-spacing:.02em; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .dot.on { background:var(--rx); box-shadow:0 0 8px rgba(62,207,142,.6); }
  .spacer { flex:1; }
  .meta { color:var(--muted); font-size:12px; font-family:ui-monospace,Consolas,monospace; }
  aside { border-right:1px solid var(--line); background:var(--panel2); overflow:auto; padding:14px; }
  main { display:grid; grid-template-rows:auto 1fr auto; min-width:0; min-height:0; }
  section.toolbar {
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    padding:10px 12px; border-bottom:1px solid var(--line); background:var(--panel2);
  }
  .frames {
    overflow:auto; padding:10px 12px; font-family:ui-monospace,Consolas,monospace;
    font-size:12px; background:var(--bg);
  }
  .row {
    display:grid; grid-template-columns: 84px 36px 52px 1fr; gap:8px;
    padding:3px 6px; border-radius:4px; align-items:baseline;
  }
  .row:hover { background:rgba(255,255,255,.03); }
  .row.tx { background:rgba(61,156,240,.08); }
  .row.rx { background:rgba(62,207,142,.08); }
  .dir { font-weight:700; }
  .dir.tx { color:var(--tx); }
  .dir.rx { color:var(--rx); }
  .t { color:var(--muted); }
  .n { color:var(--muted); text-align:right; }
  .hex { color:var(--ink); word-break:break-all; }
  .ascii { color:var(--muted); }
  .sendbar {
    display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line);
    background:var(--panel2); align-items:center;
  }
  .sendbar textarea {
    flex:1; min-height:40px; resize:vertical; background:var(--bg); color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font:12px/1.4 ui-monospace,Consolas,monospace;
  }
  h2 { margin:0 0 10px; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  label { display:block; margin:0 0 10px; color:var(--muted); font-size:11px; }
  label span { display:block; margin-bottom:4px; }
  input, select, button {
    font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line);
    border-radius:8px; padding:7px 10px;
  }
  input, select { width:100%; }
  button { cursor:pointer; background:var(--panel); }
  button:hover { border-color:var(--accent); }
  button.primary { background:rgba(122,162,247,.18); border-color:rgba(122,162,247,.5); }
  button.danger { background:rgba(240,113,120,.12); border-color:rgba(240,113,120,.45); color:#ffb3b8; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .rowbtns { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .rowbtns button { flex:1; min-width:64px; }
  .checks { display:flex; gap:12px; margin:0 0 12px; }
  .checks label { display:flex; align-items:center; gap:6px; margin:0; color:var(--ink); font-size:12px; }
  .statusline { padding:8px 12px; border-bottom:1px solid var(--line); color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); padding:24px; text-align:center; }
  .pill {
    display:inline-block; padding:2px 8px; border-radius:99px; font-size:11px;
    background:rgba(122,162,247,.15); color:var(--accent);
  }
</style>
</head>
<body>
<header>
  <span id="dot" class="dot"></span>
  <h1>UART Hub</h1>
  <span id="connLabel" class="pill">未连接</span>
  <span class="spacer"></span>
  <span class="meta" id="seqLabel">seq 0</span>
  <span class="meta" id="countLabel">0 frames</span>
</header>
<aside>
  <h2>连接配置</h2>
  <label><span>端口</span>
    <input id="path" list="portList" placeholder="COM5" autocomplete="off"/>
    <datalist id="portList"></datalist>
  </label>
  <div class="rowbtns"><button id="btnRefresh" type="button">刷新端口</button></div>
  <label><span>波特率</span>
    <select id="baud">
      <option>9600</option><option>19200</option><option>38400</option>
      <option>57600</option><option selected>115200</option>
      <option>230400</option><option>460800</option><option>921600</option>
      <option value="727000">727000 (W6729)</option>
    </select>
  </label>
  <label><span>数据位</span><select id="dataBits"><option>8</option><option>7</option></select></label>
  <label><span>停止位</span><select id="stopBits"><option>1</option><option>2</option></select></label>
  <label><span>校验</span>
    <select id="parity"><option value="none">none</option><option value="even">even</option><option value="odd">odd</option></select>
  </label>
  <label><span>编码</span>
    <select id="encoding">
      <option value="utf8">utf8</option>
      <option value="hex">hex</option>
      <option value="ascii">ascii</option>
      <option value="gbk">gbk</option>
      <option value="latin1">latin1</option>
      <option value="base64">base64</option>
    </select>
  </label>
  <label><span>协议</span>
    <select id="protocol">
      <option value="raw" selected>raw</option>
      <option value="line">line</option>
      <option value="delimiter">delimiter</option>
      <option value="modbus-rtu">modbus-rtu</option>
      <option value="hex-frame">hex-frame</option>
      <option value="slip">slip</option>
    </select>
  </label>
  <label><span>分隔符 (hex, delimiter 用)</span><input id="delimiter" placeholder="0D0A"/></label>
  <div class="checks">
    <label><input type="checkbox" id="dtr" checked/> DTR</label>
    <label><input type="checkbox" id="rts" checked/> RTS</label>
  </div>
  <div class="rowbtns">
    <button id="btnConnect" class="primary" type="button">连接</button>
    <button id="btnDisconnect" class="danger" type="button" disabled>断开</button>
  </div>
  <h2>信号</h2>
  <div class="rowbtns">
    <button id="btnDtr" type="button" disabled>DTR</button>
    <button id="btnRts" type="button" disabled>RTS</button>
    <button id="btnBreak" type="button" disabled>Break</button>
  </div>
  <h2>应用配置</h2>
  <div class="rowbtns"><button id="btnApply" type="button" disabled>应用到当前连接</button></div>
  <p style="color:var(--muted);font-size:11px;margin-top:16px;">仅绑定 127.0.0.1。与 MCP 共用串口时请避免同时打开同一 COM。</p>
</aside>
<main>
  <div class="statusline" id="statusLine">就绪</div>
  <section class="toolbar">
    <select id="filterDir">
      <option value="all">全部 TX+RX</option>
      <option value="rx">仅 RX</option>
      <option value="tx">仅 TX</option>
    </select>
    <input id="filterHex" placeholder="过滤 hex 包含, 如 AA55" style="width:180px"/>
    <input id="filterText" placeholder="过滤文本" style="width:140px"/>
    <label style="display:flex;align-items:center;gap:6px;margin:0;color:var(--ink)">
      <input type="checkbox" id="follow" checked/> 跟随
    </label>
    <label style="display:flex;align-items:center;gap:6px;margin:0;color:var(--ink)">
      <input type="checkbox" id="showAscii" checked/> ASCII
    </label>
    <button id="btnClear" type="button">清空显示</button>
  </section>
  <div class="frames" id="frames"><div class="empty">连接后显示实时帧</div></div>
  <div class="sendbar">
    <textarea id="sendData" placeholder="发送内容（按上方编码；hex 时可写 01 02 AA55 或 0102AA55）。Ctrl+Enter 发送"></textarea>
    <button id="btnSend" class="primary" type="button" disabled>发送</button>
  </div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
