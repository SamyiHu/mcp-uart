<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>UART Hub</title>
<style>
  :root {
    --void: #0b0e12;
    --panel: #151c24;
    --panel-2: #10161d;
    --ink: #e8eef5;
    --mute: #8b9aab;
    --line: #243041;
    --tx: #3b82f6;
    --rx: #22c55e;
    --amber: #f59e0b;
    --err: #f87171;
    --ring: rgba(59, 130, 246, 0.55);
    --radius: 8px;
    --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "Cascadia Code", Consolas, "SF Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.45 var(--font);
    background: var(--void);
    color: var(--ink);
    display: grid;
    grid-template-columns: 288px minmax(0, 1fr);
    grid-template-rows: 44px minmax(0, 1fr);
    overflow: hidden;
  }
  :focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }

  /* — instrument strip — */
  .strip {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
  }
  .strip .brand {
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .led {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4b5563;
    flex: none;
  }
  .led.on {
    background: var(--rx);
    box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15), 0 0 10px rgba(34, 197, 94, 0.7);
  }
  .led.warn { background: var(--amber); box-shadow: 0 0 8px rgba(245, 158, 11, 0.55); }
  .conn-pill {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--mute);
    background: var(--panel);
  }
  .conn-pill.on {
    color: #86efac;
    border-color: rgba(34, 197, 94, 0.35);
    background: rgba(34, 197, 94, 0.08);
  }
  .strip .grow { flex: 1; }
  .strip .meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--mute);
  }

  /* — config rail — */
  .rail {
    background: var(--panel-2);
    border-right: 1px solid var(--line);
    overflow: auto;
    padding: 14px 14px 24px;
  }
  .rail h2 {
    margin: 0 0 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .rail h2:not(:first-child) { margin-top: 18px; }
  .field { margin: 0 0 10px; }
  .field > span {
    display: block;
    margin-bottom: 4px;
    font-size: 11px;
    color: var(--mute);
  }
  .field input, .field select {
    width: 100%;
    color: var(--ink);
    background: var(--void);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 7px 9px;
    font: inherit;
  }
  .field input:hover, .field select:hover { border-color: #334155; }
  .inline-checks {
    display: flex;
    gap: 14px;
    margin: 0 0 12px;
  }
  .inline-checks label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--ink);
    font-size: 12px;
  }
  .btn-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  button {
    font: inherit;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 7px 10px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #475569; background: #1a2330; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary {
    background: rgba(59, 130, 246, 0.16);
    border-color: rgba(59, 130, 246, 0.45);
    color: #bfdbfe;
  }
  button.primary:hover:not(:disabled) {
    background: rgba(59, 130, 246, 0.24);
    border-color: rgba(59, 130, 246, 0.7);
  }
  button.danger {
    background: rgba(248, 113, 113, 0.1);
    border-color: rgba(248, 113, 113, 0.4);
    color: #fecaca;
  }
  button.danger:hover:not(:disabled) {
    background: rgba(248, 113, 113, 0.18);
    border-color: rgba(248, 113, 113, 0.65);
  }
  button.ghost { background: transparent; }
  .btn-row button { flex: 1; min-width: 0; }
  .note {
    margin: 14px 0 0;
    font-size: 11px;
    line-height: 1.5;
    color: var(--mute);
  }

  /* — main tape — */
  main {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    min-width: 0;
    min-height: 0;
    background: var(--void);
  }
  .status {
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    color: var(--mute);
    background: var(--panel-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status.error { color: #fecaca; }
  .status.ok { color: #86efac; }
  .tools {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
  }
  .tools select, .tools input[type="text"] {
    color: var(--ink);
    background: var(--void);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 6px 8px;
    font: inherit;
  }
  .tools label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--ink);
    font-size: 12px;
    margin: 0;
  }
  .tape {
    overflow: auto;
    padding: 0;
    font-family: var(--mono);
    font-size: 12px;
  }
  .empty {
    color: var(--mute);
    padding: 48px 16px;
    text-align: center;
  }
  .empty strong { display: block; color: var(--ink); margin-bottom: 6px; font-weight: 600; }
  .empty span { font-size: 12px; }
  .frame {
    display: grid;
    grid-template-columns: 10px 88px 28px 48px minmax(0, 1fr);
    gap: 0;
    border-bottom: 1px solid rgba(36, 48, 65, 0.55);
    min-height: 28px;
    align-items: stretch;
  }
  .frame:hover { background: rgba(255, 255, 255, 0.02); }
  .frame .rail-tx, .frame .rail-rx { width: 3px; }
  .frame.tx .rail-tx { background: var(--tx); }
  .frame.rx .rail-rx { background: var(--rx); }
  .frame .c-time, .frame .c-dir, .frame .c-n, .frame .c-data {
    display: flex;
    align-items: center;
    padding: 4px 8px;
  }
  .frame .c-time { color: var(--mute); font-size: 11px; }
  .frame .c-dir { font-weight: 700; font-size: 11px; letter-spacing: 0.04em; }
  .frame.tx .c-dir { color: #93c5fd; }
  .frame.rx .c-dir { color: #86efac; }
  .frame .c-n { color: var(--mute); justify-content: flex-end; font-size: 11px; }
  .frame .c-data { word-break: break-all; gap: 12px; }
  .frame .hex { color: var(--ink); }
  .frame .ascii { color: var(--mute); }
  .send {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--line);
    background: var(--panel-2);
    align-items: stretch;
  }
  .send textarea {
    flex: 1;
    min-height: 44px;
    resize: vertical;
    color: var(--ink);
    background: var(--void);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 10px;
    font: 12px/1.4 var(--mono);
  }
  .send button { min-width: 88px; }
  .hint {
    margin-top: 8px;
    font-size: 11px;
    color: var(--mute);
  }

  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: 44px auto minmax(0, 1fr); }
    .rail { border-right: 0; border-bottom: 1px solid var(--line); max-height: 42vh; }
    .frame { grid-template-columns: 6px 76px 24px 40px minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<header class="strip">
  <span id="led" class="led" title="连接状态"></span>
  <span class="brand">UART Hub</span>
  <span id="connLabel" class="conn-pill">未连接</span>
  <span class="grow"></span>
  <span class="meta" id="seqLabel">seq 0</span>
  <span class="meta" id="countLabel">0 帧</span>
</header>

<aside class="rail">
  <h2>连接</h2>
  <div class="field"><span>串口</span>
    <input id="path" list="portList" placeholder="COM5" autocomplete="off"/>
    <datalist id="portList"></datalist>
  </div>
  <div class="btn-row">
    <button id="btnRefresh" type="button" class="ghost">刷新端口</button>
  </div>
  <div class="field"><span>波特率</span>
    <select id="baud">
      <option>9600</option>
      <option>19200</option>
      <option>38400</option>
      <option>57600</option>
      <option selected>115200</option>
      <option>230400</option>
      <option>460800</option>
      <option>921600</option>
      <option value="727000">727000（W6729）</option>
    </select>
  </div>
  <div class="field"><span>数据位</span>
    <select id="dataBits"><option>8</option><option>7</option></select>
  </div>
  <div class="field"><span>停止位</span>
    <select id="stopBits"><option>1</option><option>2</option></select>
  </div>
  <div class="field"><span>校验</span>
    <select id="parity">
      <option value="none">none</option>
      <option value="even">even</option>
      <option value="odd">odd</option>
    </select>
  </div>
  <div class="field"><span>编码</span>
    <select id="encoding">
      <option value="utf8">utf8</option>
      <option value="hex">hex</option>
      <option value="ascii">ascii</option>
      <option value="gbk">gbk</option>
      <option value="latin1">latin1</option>
      <option value="base64">base64</option>
    </select>
  </div>
  <div class="field"><span>协议</span>
    <select id="protocol">
      <option value="raw" selected>raw</option>
      <option value="line">line</option>
      <option value="delimiter">delimiter</option>
      <option value="modbus-rtu">modbus-rtu</option>
      <option value="hex-frame">hex-frame</option>
      <option value="slip">slip</option>
    </select>
  </div>
  <div class="field"><span>分隔符 hex（delimiter）</span>
    <input id="delimiter" placeholder="0D0A"/>
  </div>
  <div class="inline-checks">
    <label><input type="checkbox" id="dtr" checked/> DTR</label>
    <label><input type="checkbox" id="rts" checked/> RTS</label>
  </div>
  <div class="btn-row">
    <button id="btnConnect" class="primary" type="button">连接</button>
    <button id="btnDisconnect" class="danger" type="button" disabled>断开</button>
  </div>

  <h2>信号</h2>
  <div class="btn-row">
    <button id="btnDtr" type="button" disabled class="ghost">DTR</button>
    <button id="btnRts" type="button" disabled class="ghost">RTS</button>
    <button id="btnBreak" type="button" disabled class="ghost">Break</button>
  </div>

  <h2>在线改参</h2>
  <div class="btn-row">
    <button id="btnApply" type="button" disabled>应用到当前连接</button>
  </div>
  <p class="note">仅监听 127.0.0.1。与 MCP 同时打开同一 COM 会被系统互斥占用。若 8787 被示波器等占用，Hub 会自动换端口。</p>
</aside>

<main>
  <div class="status" id="statusLine">就绪 — 选择串口后点「连接」</div>
  <div class="tools">
    <select id="filterDir" aria-label="方向过滤">
      <option value="all">全部 TX+RX</option>
      <option value="rx">仅 RX</option>
      <option value="tx">仅 TX</option>
    </select>
    <input id="filterHex" type="text" placeholder="hex 包含 AA55" style="width:160px" aria-label="hex 过滤"/>
    <input id="filterText" type="text" placeholder="文本过滤" style="width:130px" aria-label="文本过滤"/>
    <label><input type="checkbox" id="follow" checked/> 跟随</label>
    <label><input type="checkbox" id="showAscii" checked/> ASCII</label>
    <button id="btnClear" type="button" class="ghost">清空</button>
  </div>
  <div class="tape" id="frames">
    <div class="empty">
      <strong>暂无帧</strong>
      <span>连接成功后，TX/RX 会以双色轨实时写入这卷胶带</span>
    </div>
  </div>
  <div class="send">
    <textarea id="sendData" placeholder="发送内容（按上方编码；hex 可写 01 02 AA55）。Ctrl+Enter 发送"></textarea>
    <button id="btnSend" class="primary" type="button" disabled>发送</button>
  </div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
