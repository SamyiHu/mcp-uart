[package]
name = "uartd"
version = "0.1.0"
edition = "2021"
description = "Serial port daemon: MCP stdio server + local HTTP/SSE hub for the UART console"
license = "MIT"

[[bin]]
name = "uartd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.6"
encoding_rs = "0.8"
base64 = "0.22"
tiny_http = "0.12"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
